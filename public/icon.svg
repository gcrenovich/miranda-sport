<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <!-- Glow Effect -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ff2a75" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff2a75" stop-opacity="0" />
    </radialGradient>
    <!-- Logo Rainbow Gradient -->
    <linearGradient id="logoRainbowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e60012" />
      <stop offset="17%" stop-color="#f39800" />
      <stop offset="34%" stop-color="#fff100" />
      <stop offset="51%" stop-color="#009944" />
      <stop offset="68%" stop-color="#00a0e9" />
      <stop offset="85%" stop-color="#1d2088" />
      <stop offset="100%" stop-color="#920783" />
    </linearGradient>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" stroke="#27272a" stroke-width="2" />

  <!-- Radial Glow Behind Logo -->
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)" />

  <!-- Symmetrical Heart and Pulse Scaled/Centered -->
  <g transform="translate(116, 116) scale(3.5)">
    <!-- Heart outline with rainbow stroke -->
    <path d="M 40,32 C 30,18 5,18 5,44 C 5,66 30,81 40,89 C 50,81 75,66 75,44 C 75,18 50,18 40,32 Z" 
          fill="none" 
          stroke="url(#logoRainbowGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Background pulse line -->
    <path d="M 6,52 L 18,52 L 24,32 L 33,66 L 42,32 L 50,66 L 56,52 L 72,52" 
          fill="none" 
          stroke="#000000" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.5" />
          
    <!-- Foreground pulse line (M) -->
    <path d="M 6,52 L 18,52 L 24,32 L 33,66 L 42,32 L 50,66 L 56,52 L 72,52" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
